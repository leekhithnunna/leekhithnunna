<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0c29">
        <animate attributeName="stop-color" values="#0f0c29;#1a1b27;#0f0c29" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#1a1b27">
        <animate attributeName="stop-color" values="#1a1b27;#2b1a3d;#1a1b27" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF">
        <animate attributeName="stop-color" values="#00E5FF;#FF6EC7;#00E5FF" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#FF6EC7">
        <animate attributeName="stop-color" values="#FF6EC7;#00E5FF;#FF6EC7" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>
  <rect width="1200" height="260" rx="18" fill="url(#bg)"/>
  <circle cx="120" cy="60" r="90" fill="#00E5FF" opacity="0.08"/>
  <circle cx="1100" cy="210" r="120" fill="#FF6EC7" opacity="0.08"/>
  <text x="600" y="130" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="68" font-weight="800" fill="url(#txt)">Leekhith Nunna</text>
  <text x="600" y="180" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="24" fill="#c9d1d9">AI / ML Engineer · NLP &amp; Speech · Computer Vision</text>
  <rect x="470" y="208" width="260" height="3" rx="2" fill="url(#txt)">
    <animate attributeName="width" values="0;260;260" keyTimes="0;0.6;1" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
